name: PHPUnit

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    phpunit:
        name: "PHPUnit ${{ matrix.php_version }}"

        runs-on: ubuntu-latest
        strategy:
            matrix:
                php_version: [8.4]

        steps:
            -   uses: actions/checkout@v4

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php_version }}
                    coverage: none

            -   name: "Install dependencies with Composer"
                run: composer install --no-interaction --no-progress

            # PHPUnit from composer.json, the version the tests are written for
            -   name: "Run PHPUnit"
                run: vendor/bin/phpunit -c tests/phpunit/phpunit.xml
